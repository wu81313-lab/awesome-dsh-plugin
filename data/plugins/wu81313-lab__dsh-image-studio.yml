name: wu81313-lab/dsh-image-studio
category: ui
description:
  en: Shows generated images inline in the conversation with a bottom-left edit button that annotates, erases through a generated RGBA mask, and crops or resizes, then hands the result back to the agent as a new message.
  zh: 把生成的图片内嵌显示在对话里，图片左下角的编辑按钮支持标注、用生成的 RGBA 蒙版擦除、裁剪与调整尺寸，编辑结果作为新消息交回 agent。
