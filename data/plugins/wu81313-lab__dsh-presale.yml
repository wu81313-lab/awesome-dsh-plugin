description:
  en: 'DingTalk group assistant: polls for trigger phrases in messages you send yourself, then posts a customizable multi-line checklist (@-mentioning the sales owner inferred from recent chat) or an AI-written requirement summary built from recent messages and shared files.'
  zh: '钉钉群助手：轮询你本人发出的触发短语，自动在会话里发可自定义的多行清单（并 @ 依据聊天记录判出的销售），或依据近期消息与群文件由模型生成需求梳理总结。'
